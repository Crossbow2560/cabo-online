services:
  cabo:
    build: .
    image: cabo-online
    restart: unless-stopped
    ports:
      # this machine only: the Cloudflare Tunnel reaches it on 127.0.0.1, and nothing else can
      # bypass the tunnel and fake CF-Connecting-IP (TRUST_PROXY=1 trusts that header)
      - "127.0.0.1:3101:3101"
    # DATABASE_URL (Supabase session-pooler string). Missing = in-memory storage.
    env_file:
      - path: apps/server/.env
        required: false
    # hardening: a bug in the server shouldn't be able to write to the image, gain privileges or
    # starve the other services on this machine
    read_only: true
    tmpfs:
      - /tmp:size=64m # required: tsx writes its cache to /tmp (crashes on boot without it)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0

  # ---- Umami (self-hosted, cookie-free analytics). Off unless asked for:
  #   docker compose --profile analytics up -d
  # Secrets live in umami.env (gitignored; see docs/analytics.md). Dashboard: http://localhost:3200
  umami:
    image: ghcr.io/umami-software/umami:latest
    profiles: [analytics]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3200:3000" # this machine only (reach it through the reverse proxy); 3000 is often taken
    env_file:
      - path: umami.env
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:15-alpine
    profiles: [analytics]
    restart: unless-stopped
    env_file:
      - path: umami.env
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
